apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/gabriel25115CG/IAC-Homelab.git
        revision: master
        directories:
          - path: kubernetes/apps/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/gabriel25115CG/IAC-Homelab.git
        targetRevision: master
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Certains CRD volumineux (ex: kube-prometheus-stack) dépassent la
          # limite de 256 Ko de l'annotation last-applied-configuration en
          # apply classique — déjà rencontré avec le CRD ApplicationSet
          # d'ArgoCD lui-même. Server-side apply évite la classe de problème
          # pour toutes les apps, présentes et futures.
          - ServerSideApply=true
