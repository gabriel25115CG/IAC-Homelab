apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Uniquement utilisée par Let's Encrypt pour les alertes d'expiration de
    # certificat, jamais publiée. Remplace par ta propre adresse avant d'appliquer.
    email: gabrielchalmet@proton.me
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - gabriel0day.cloud
