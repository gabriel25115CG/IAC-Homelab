# Placeholder SealedSecret. The encrypted content depends on the public key
# generated at runtime by the Sealed Secrets controller of THIS cluster, so it
# cannot be produced in advance and must be regenerated once the controller
# from kubernetes/apps/sealed-secrets is installed and running.
#
# To generate the real SealedSecret and replace this file:
#   1. Create a Cloudflare API token with Zone.DNS edit permission on the zone
#      for gabriel0day.cloud.
#   2. kubectl create secret generic cloudflare-api-token-secret \
#        --namespace cert-manager \
#        --from-literal=api-token=<CLOUDFLARE_API_TOKEN> \
#        --dry-run=client -o yaml > cloudflare-api-token-secret.yaml
#   3. kubeseal --format yaml \
#        --controller-name sealed-secrets \
#        --controller-namespace kube-system \
#        < cloudflare-api-token-secret.yaml > cloudflare-api-token-sealed-secret.yaml
#   4. Delete the plaintext cloudflare-api-token-secret.yaml, commit only the
#      SealedSecret, and replace this placeholder file.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  encryptedData:
    api-token: PLACEHOLDER_REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: cloudflare-api-token-secret
      namespace: cert-manager
    type: Opaque
