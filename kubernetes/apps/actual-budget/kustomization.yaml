apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Pas de CI qui bump ce tag (contrairement à app/*) : "latest" convient pour
# une première installation, mais épingle une version précise
# (ex: 25.x.x) une fois configuré, pour éviter une mise à jour surprise du
# format de données au prochain redémarrage du pod.
images:
  - name: actualbudget/actual-server
    newTag: latest
