# node-exporter a besoin de hostNetwork/hostPID/hostPath (lire les métriques
# de l'hôte) — Talos applique PodSecurity "baseline" par défaut hors
# kube-system, donc ce namespace doit être explicitement marqué "privileged"
# (même situation que Longhorn, voir kubernetes/apps/longhorn).
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
