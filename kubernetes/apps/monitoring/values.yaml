# Talos n'expose pas etcd/kube-controller-manager/kube-scheduler/kube-proxy
# de la même façon qu'un cluster kubeadm classique (pas de Service correspondant
# dans kube-system) — désactiver ces monitors évite des cibles de scrape
# systématiquement vides/en erreur.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

grafana:
  # kustomize rend le chart via `helm template` (pas `helm install`), qui n'a
  # pas accès au cluster pour vérifier si un secret existe déjà : la fonction
  # randAlphaNum du chart génère donc un nouveau mot de passe aléatoire à
  # CHAQUE sync. Un existingSecret fixe (scellé) évite ce problème.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  # Le volume Longhorn est ReadWriteOnce : avec la stratégie par défaut
  # (RollingUpdate), l'ancien et le nouveau pod peuvent se retrouver
  # programmés sur des nœuds différents et se disputer le volume
  # (Multi-Attach error), bloquant le rollout. Recreate évite ce cas.
  strategy:
    type: Recreate
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      # 256Mi causait des OOMKill réguliers (Grafana + ses sidecars de
      # provisioning dashboards/datasources dépassent cette limite).
      memory: 512Mi
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - grafana.gabriel0day.cloud
    tls:
      - hosts:
          - grafana.gabriel0day.cloud
        secretName: grafana-tls
