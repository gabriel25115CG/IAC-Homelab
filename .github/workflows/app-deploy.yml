name: App Deploy (reusable)

on:
  workflow_call:
    inputs:
      app_name:
        description: Name of the app, must match a directory under kubernetes/apps/
        required: true
        type: string
      image_name:
        description: Full image name without tag, e.g. ghcr.io/owner/portfolio
        required: true
        type: string
    secrets:
      token:
        description: GitHub token with push access to this repository (contents write)
        required: true

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ inputs.image_name }}:${{ steps.tag.outputs.tag }}

  bump-manifest:
    name: Bump image tag in IAC-Homelab
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IAC-Homelab
        uses: actions/checkout@v4
        with:
          repository: gabriel25115CG/IAC-Homelab
          ref: main
          token: ${{ secrets.token }}

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump image tag
        working-directory: kubernetes/apps/${{ inputs.app_name }}
        run: kustomize edit set image ${{ inputs.image_name }}=${{ inputs.image_name }}:${{ needs.build-and-push.outputs.image_tag }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/${{ inputs.app_name }}/kustomization.yaml
          git commit -m "chore(${{ inputs.app_name }}): bump image to ${{ needs.build-and-push.outputs.image_tag }}"
          git push origin main
