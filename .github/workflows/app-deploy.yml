name: Deploy apps

on:
  push:
    branches: [master]
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Nom de l'app à (re)builder manuellement (dossier sous app/)"
        required: true
        type: string

# contents:write pour committer le bump de tag, packages:write pour pousser sur GHCR.
# Tout se passe dans ce même repo (monorepo), donc GITHUB_TOKEN suffit — pas de PAT.
permissions:
  contents: write
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: detect
        run: |
          if [ -n "${{ inputs.app }}" ]; then
            apps='["${{ inputs.app }}"]'
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
              before=$(git rev-parse HEAD~1 2>/dev/null || echo "$(git hash-object -t tree /dev/null)")
            fi
            apps=$(git diff --name-only "$before" "${{ github.sha }}" -- app/ | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "apps=$apps" | tee -a "$GITHUB_OUTPUT"

  # Scan de secrets sur tout le repo (pas seulement l'app qui a changé) — un
  # token/clé committé par erreur n'importe où doit bloquer le déploiement.
  security-scan:
    needs: detect
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy:
    needs: [detect, security-scan]
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        app: ${{ fromJson(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and owner
        id: tag
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Bloque sur les vulnérabilités Critical/High dans les dépendances npm
      # de l'app — avant même de construire l'image.
      - name: Audit npm dependencies
        working-directory: app/${{ matrix.app }}
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le dossier app/<app> ne contient que du code applicatif — aucun Dockerfile
      # à écrire côté développeur. Le build utilise un template Dockerfile générique
      # géré par l'infra (ci/templates/spa), avec app/<app> comme seul contexte de build.
      - name: Prepare build context
        run: cp ci/templates/spa/dockerignore app/${{ matrix.app }}/.dockerignore

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: app/${{ matrix.app }}
          file: ci/templates/spa/Dockerfile
          build-contexts: |
            templates=ci/templates/spa
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner }}/${{ matrix.app }}:latest

      # TODO: désactivé temporairement (2026-08-17) — l'image de base
      # nginx:1.27-alpine a des CVE Critical/High non liées au code applicatif
      # (openssl/libxml2/zlib/musl), ce qui bloquait tout déploiement le temps
      # de traiter ça séparément. Réactiver une fois l'image de base à jour.
      # - name: Scan image for vulnerabilities (Trivy)
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ghcr.io/${{ steps.tag.outputs.owner }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}
      #     severity: CRITICAL,HIGH
      #     exit-code: "1"

      - name: Install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      # Un développeur qui ajoute app/<nom> n'a jamais besoin de créer les
      # manifests Kubernetes : au premier push d'une app inconnue, on les
      # génère depuis ci/templates/k8s-spa (host = <nom>.gabriel0day.cloud,
      # dérivé automatiquement du nom du dossier sous app/).
      - name: Scaffold Kubernetes manifests if missing
        id: scaffold
        run: |
          if [ ! -d "kubernetes/apps/${{ matrix.app }}" ]; then
            mkdir -p "kubernetes/apps/${{ matrix.app }}"
            for f in ci/templates/k8s-spa/*; do
              sed -e "s/__APP_NAME__/${{ matrix.app }}/g" -e "s/__OWNER__/${{ steps.tag.outputs.owner }}/g" \
                "$f" > "kubernetes/apps/${{ matrix.app }}/$(basename "$f")"
            done
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump image tag in manifest
        working-directory: kubernetes/apps/${{ matrix.app }}
        run: kustomize edit set image ghcr.io/${{ steps.tag.outputs.owner }}/${{ matrix.app }}=ghcr.io/${{ steps.tag.outputs.owner }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/${{ matrix.app }}/
          if [ "${{ steps.scaffold.outputs.scaffolded }}" = "true" ]; then
            msg="feat(${{ matrix.app }}): scaffold app and deploy image ${{ steps.tag.outputs.tag }}"
          else
            msg="chore(${{ matrix.app }}): bump image to ${{ steps.tag.outputs.tag }}"
          fi
          git commit -m "$msg"
          git pull --rebase origin master
          git push origin master
